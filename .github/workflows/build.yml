name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Project
        run: |
          bash ./package.sh
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          echo "version=v$version" >> $GITHUB_ENV

          # 只取 UPDATE.md 里当前版本那一节作为 Release body。
          # 整份 UPDATE.md 有近 600 行历史（含 3.2.x fork 各版），全塞进 Release 页没法看。
          # 用 index() 而不是正则：版本号里的点会被当元字符，"3.4.7" 能匹配到 "3x4y7"。
          # ver 带 v 前缀（如 v3.4.11）而小节标题不带，匹配时两种都认。
          # started 用来吃掉小节标题后的首行空行，避免 body 以空行开头。
          awk -v ver="$version" '
            BEGIN { ver_nov = ver; sub(/^v/, "", ver_nov) }
            index($0, "## " ver " 增量") == 1 || index($0, "## " ver_nov " 增量") == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { if (!started && $0 ~ /^[[:space:]]*$/) next; started = 1; print }
          ' UPDATE.md > release_body.md

          # 去掉尾部多余空行，以及小节末尾的分隔线
          # （那个 --- 原本是与下一个版本标题之间的分界，留着会和下方页脚的分隔线连成两条）
          awk '
            { line[NR] = $0 }
            END {
              last = NR
              while (last > 0 && (line[last] ~ /^[[:space:]]*$/ || line[last] ~ /^[[:space:]]*---[[:space:]]*$/)) last--
              for (i = 1; i <= last; i++) print line[i]
            }
          ' release_body.md > release_body.tmp && mv release_body.tmp release_body.md

          # 兜底：UPDATE.md 里漏写该版本小节时退回整篇，而不是发一个空 body
          if [ ! -s release_body.md ]; then
            echo "::warning::UPDATE.md 中未找到 ## $version 增量 小节，Release body 退回整篇"
            cp UPDATE.md release_body.md
          fi

          # 末尾附全量变更日志入口，方便回溯
          printf '\n---\n\n完整变更历史见 [UPDATE.md](https://github.com/%s/blob/master/UPDATE.md)\n' \
            "${{ github.repository }}" >> release_body.md

          echo "--- release body 预览（前 20 行）---"
          head -20 release_body.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.version }}
          body_path: release_body.md
          tag_name: ${{ env.version }}
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./ani-rss-application/target/ani-rss.jar
            ./ani-rss-application/target/ani-rss.exe
