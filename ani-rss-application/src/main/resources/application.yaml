spring:
  application:
    name: ani-rss-application
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        protocol: streamable
        streamable-http:
          mcp-endpoint: /api/mcp
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 50MB
      enabled: true
  jmx:
    enabled: false
server:
  port: 7789
  # 默认仅本机监听，需要局域网/公网访问时设置环境变量 SERVER_ADDRESS=0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  tomcat:
    threads:
      max: 100
      min-spare: 5

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  default-produces-media-type: application/json