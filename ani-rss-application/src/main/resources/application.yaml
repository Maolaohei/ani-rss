spring:
  application:
    name: ani-rss-application
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        protocol: streamable
        streamable-http:
          mcp-endpoint: /api/mcp
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-request-size: 200MB
      max-file-size: 200MB
      enabled: true
  jmx:
    enabled: false
server:
  port: 7789
  # 默认仅本机监听，需要局域网/公网访问时设置环境变量 SERVER_ADDRESS=0.0.0.0
  address: ${SERVER_ADDRESS:127.0.0.1}
  tomcat:
    threads:
      # lowmem 档（JAVA_PROFILE=lowmem）由 docker/run.sh 设成 40：小内存机器上
      # 100 条工作线程的栈预留没必要，限量后反而更容易判断过载。默认值保持 100 不变。
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: 5

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  default-produces-media-type: application/json